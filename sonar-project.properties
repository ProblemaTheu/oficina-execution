# projectKey e organization vêm das variables do repo (SONAR_PROJECT_KEY,
# SONAR_ORGANIZATION), passadas pelo workflow.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/docs/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# Fora do cálculo de cobertura (seguem analisados para bugs/smells) — mesma
# lista de scripts/cobertura.sh:
# - cmd: bootstrap do serviço (ambiente, clientes AWS, laços);
# - internal/infra/dynamo: adaptador testado contra DynamoDB real (LocalStack,
#   job "Integração (LocalStack)"); o Sonar só recebe o perfil unitário.
sonar.coverage.exclusions=cmd/**,internal/infra/dynamo/**
