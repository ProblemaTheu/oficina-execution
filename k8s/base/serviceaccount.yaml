# Identidade AWS do pod por EKS Pod Identity: a associação
# (namespace execution-prod + service account execution → role oficina-execution-pod)
# está em infra/pod.tf. Nenhuma chave AWS no cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: execution
  labels:
    app.kubernetes.io/name: execution
    app.kubernetes.io/part-of: oficina
